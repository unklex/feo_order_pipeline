[project]
name = "feo-order-pipeline"
version = "0.1.0"
description = "Заказы ФГИС ОПВК -> MySQL -> Битрикс24 (смарт-процесс ФЭО)"
requires-python = ">=3.13"
dependencies = [
    # данные и БД
    "pandas>=3.0.5",
    "sqlalchemy>=2.0.52",
    "pymysql>=1.2.0",
    "openpyxl>=3.1.5",          # отчёт fill db.py о созданных компаниях (.xlsx)
    # SSH-туннель к БД (нужен только при DB_USE_SSH=1)
    "sshtunnel>=0.4.0",
    "paramiko>=5.0.0",
    # ФГИС ОПВК и Битрикс24
    "requests>=2.34.2",
    "urllib3>=2.7.0",
    "selenium>=4.48.0",         # вход на gisopvk.ru через Chrome
    "fast-bitrix24>=1.8.14",
    # прочее
    "python-dotenv>=1.2.3",
    "tqdm>=4.70.0",
    "streamlit>=1.64.0",        # UI: app.py
]

[tool.uv]
# Набор скриптов, а не устанавливаемый пакет: uv только ставит зависимости в .venv
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Скрипты лежат в корне проекта, а не в пакете
pythonpath = ["."]
testpaths = ["tests"]
